<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RP Lab Editor v2</title>
<style>
:root{--bg:#f6f6f4;--panel:#fff;--soft:#efefec;--line:#dddcd7;--text:#1d1d1b;--muted:#6b6a65;--accent:#2f6fd6;--accent-ink:#fff;--err:#b3261e;--warn:#9a5b00;--ok:#2e9e57;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--panel:#1d1d1c;--soft:#262624;--line:#353532;--text:#ecebe7;--muted:#9c9b95;--accent:#6ea3ff;--accent-ink:#0d1a33;--err:#ff8a80;--warn:#e7b45a;--ok:#5fd18a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--panel:#1d1d1c;--soft:#262624;--line:#353532;--text:#ecebe7;--muted:#9c9b95;--accent:#6ea3ff;--accent-ink:#0d1a33;--err:#ff8a80;--warn:#e7b45a;--ok:#5fd18a;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column}
#topbar{display:flex;gap:6px;align-items:center;padding:8px 14px;min-height:48px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
#topbar .title{font-weight:600;margin-right:auto}
#topbar a{color:var(--accent);font-size:12.5px;text-decoration:none}
#topbar a:hover{text-decoration:underline}
.topbar-nav{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12.5px;margin-right:6px}
.wrap{flex:1;display:flex;min-height:0}
.nav-drawer{width:255px;min-width:255px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
nav{flex:1;overflow-y:auto;padding:10px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
nav h2{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 6px 6px}
nav .it{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
nav .it:hover{background:var(--soft)}nav .it.on{background:var(--soft);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
nav .it .bad{margin-left:auto;color:var(--err);font-size:12px}
nav .it .sub{color:var(--muted);font-size:12px;margin-left:auto}nav .it .sub+.bad{margin-left:4px}
main{flex:1;overflow-y:auto;padding:18px 22px 60px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.sheet{max-width:860px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px}
.lead{color:var(--muted);font-size:13px;margin:0 0 14px}
h3{font-size:13px;margin:22px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
h3 small{font-weight:400;color:var(--muted)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
label .cnt{float:right}label .cnt.over{color:var(--warn)}
input,select,textarea{width:100%;background:var(--soft);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(47,111,214,.16)}
textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:10px}.check input{width:auto}
button{background:var(--soft);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:34px;font:inherit;cursor:pointer;transition:border-color .15s,filter .15s}
button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{padding:3px 9px;font-size:12px;min-height:28px}button.danger{color:var(--err)}
#themeBtn{min-height:34px;min-width:34px;padding:4px 9px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px}
.card .head{display:flex;gap:8px;align-items:center}.card .head input{flex:1}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips label{display:flex;align-items:center;gap:5px;margin:0;padding:3px 9px;border:1px solid var(--line);border-radius:999px;color:var(--text);font-size:13px;cursor:pointer}
.chips input{width:auto}
#issues{margin-top:4px}
.iss{font-size:13px;padding:5px 9px;border-radius:6px;margin-top:4px;background:var(--soft)}
.iss.err{color:var(--err)}.iss.warn{color:var(--warn)}.iss.ok{color:var(--ok)}
input[type=file]{display:none}
#playBtn{order:2}#themeBtn{order:3}
#menuBtn,.drawer-head,#moreBtn,.mob-lbl{display:none}
.topbar-actions{display:contents}
.drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.drawer-backdrop.on{display:block}
@media (max-width:820px){
  body{overflow:hidden}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
  .nav-drawer{position:fixed;top:0;left:0;bottom:0;width:min(84vw,300px);min-width:0;z-index:50;transform:translateX(-100%);transition:transform .22s ease;box-shadow:4px 0 24px rgba(0,0,0,.28)}
  .nav-drawer.open{transform:translateX(0)}
  #topbar{position:relative;flex-wrap:nowrap;padding:6px 10px;gap:6px;min-height:48px}
  #topbar > #menuBtn,#topbar > #moreBtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;min-height:36px;padding:0;border-radius:10px;font-size:17px;flex:0 0 auto}
  #topbar .title{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px;margin-right:0}
  #playBtn{order:0;flex:0 0 auto;white-space:nowrap;padding:5px 10px;font-size:12.5px;min-height:34px;border-radius:10px}
  .topbar-actions{display:none;position:absolute;top:calc(100% + 4px);right:10px;min-width:225px;flex-direction:column;gap:4px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.38);z-index:45}
  .topbar-actions.open{display:flex}
  .topbar-actions .topbar-nav{margin:0 0 4px;padding:4px 6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .topbar-actions button{order:0;width:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;padding:8px 10px;min-height:38px;border:1px solid transparent;background:transparent;border-radius:8px;font-size:13.5px}
  .topbar-actions button:hover{background:var(--soft);border-color:var(--line)}
  main{padding:12px 12px 60px}
  .mob-lbl{display:inline}
  input,select,textarea{font-size:16px}
}
@media (max-width:640px){
  .row{flex-direction:column}
  .grid4{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="topbar">
  <button id="menuBtn" class="small" title="Mở danh mục soạn thảo">☰</button>
  <span class="title" id="title">Soạn bộ group chat v2</span>
  <div id="topbarMenu" class="topbar-actions">
    <span class="topbar-nav">
      <a href="/">Chat đơn</a><span>·</span>
      <a href="/group">Group chat</a><span>·</span>
      <a href="/prompts">Prompt Studio</a>
    </span>
    <button id="newBtn">Mới</button>
    <button id="openBtn" title="Mở world (world-v2 / rplab-world-1), nhân vật (char-v2 / rplab-char-1) hoặc card SillyTavern (.json/.png)">Mở file…</button>
    <button id="sampleBtn">Nạp mẫu Hoa Phượng</button>
    <button id="sampleBnBtn">Nạp mẫu ĐH Bến Nghé</button>
    <button id="saveBtn">Tải world-v2 .json</button>
    <button id="themeBtn" class="small" title="Đổi giao diện sáng/tối">◐<span class="mob-lbl"> Giao diện</span></button>
  </div>
  <button id="playBtn" class="primary">▶ Chơi ngay</button>
  <button id="moreBtn" class="icon-btn" title="Thao tác khác" aria-haspopup="true" aria-expanded="false">⋯</button>
  <input type="file" id="fileIn" accept=".json,.png" multiple>
</div>
<div id="drawerBackdrop" class="drawer-backdrop"></div>
<div class="wrap">
  <div id="navDrawer" class="nav-drawer">
    <div class="drawer-head">
      <b>Mục soạn thảo</b>
      <button id="closeDrawerBtn" class="small" title="Đóng menu">✕</button>
    </div>
    <nav id="nav"></nav>
  </div>
  <main><div class="sheet" id="sheet"></div></main>
</div>

<script>
const $ = id => document.getElementById(id);
function setTopbarMenu(open) {
  const m = $('topbarMenu'), b = $('moreBtn');
  if (m) m.classList.toggle('open', !!open);
  if (b) b.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function setDrawer(open) {
  if (open) setTopbarMenu(false);
  if ($('navDrawer')) $('navDrawer').classList.toggle('open', !!open);
  if ($('drawerBackdrop')) $('drawerBackdrop').classList.toggle('on', !!open);
}
if ($('menuBtn')) $('menuBtn').onclick = () => setDrawer(true);
if ($('closeDrawerBtn')) $('closeDrawerBtn').onclick = () => setDrawer(false);
if ($('drawerBackdrop')) $('drawerBackdrop').onclick = () => setDrawer(false);
if ($('moreBtn')) $('moreBtn').onclick = e => {
  e.stopPropagation();
  setTopbarMenu(!$('topbarMenu')?.classList.contains('open'));
};
if ($('topbarMenu')) $('topbarMenu').addEventListener('click', e => {
  if (e.target.closest('button, a')) setTopbarMenu(false);
});
document.addEventListener('click', e => {
  if (!e.target.closest('#topbarMenu') && !e.target.closest('#moreBtn')) setTopbarMenu(false);
});

const savedTheme = (() => { try { const v = localStorage.getItem('rplab.theme'); return v === null ? null : JSON.parse(v); } catch { return null; } })();
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$('themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('rplab.theme', JSON.stringify(next)); } catch {}
};
const KEY = 'rplabe.world';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } };
let _editorSyncTimer = null;
const syncEditorToDB = (immediate = false) => {
  if (_editorSyncTimer) { clearTimeout(_editorSyncTimer); _editorSyncTimer = null; }
  const run = () => fetch('/api/db/editor', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: 'current', world: W }),
  }).catch(() => {});
  if (immediate) return run();
  _editorSyncTimer = setTimeout(() => { _editorSyncTimer = null; run(); }, 450);
};
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(W)); } catch {} syncEditorToDB(); };

const blankWorld = () => ({
  format: 'world-v2', id: 'the_gioi_moi',
  meta: { name: 'Thế giới mới', genre: 'Đời thường' },
  rules: { writing_style: '', world_rules: [] },
  user: { id: 'user', name: 'Bạn', aliases: [], persona: '' },
  clock: { mode: 'calendar', start: { year: 2027, month: 8, day: 30, hour: 12, minute: 30 } },
  locations: {}, lore: [], characters: {}, cast: [],
  relationships: { auto_bootstrap: true, edges: {} }, initial_facts: [],
  opening: { user_start_location: '', tension: 1, channel_type: 'in_person', narration: '' },
});
const blankCharV2 = (id, name) => ({
  format: 'char-v2', id,
  meta: { name, aliases: [name.split(' ').pop()], age: 20, gender: 'nữ', fictional: true },
  core: { one_liner: '', personality: [], values: '', boundaries: [] },
  voice: {
    dialect: 'Trung tính', tone: '',
    pronoun_defaults: {
      close_peer: { self: 'tui', call: 'ông/bà' },
      acquaintance: { self: 'mình', call: 'bạn' },
      elder_formal: { self: 'em', call: 'anh/chị' },
      angry: { self: 'tôi', call: 'ông/bà' },
    },
    modes: {
      in_person: { style: 'Văn nói trực tiếp, lồng cử chỉ vào văn xuôi.', tics: [], samples: [] },
      texting: { style: 'Tin nhắn ngắn tách dòng.', samples: [] },
    },
  },
  appearance: { summary: '', outfits: { default: 'Trang phục thường ngày' } },
  modules: [],
});
const blankCast = (id) => ({ char_id: id, role_in_world: '', start_location: '', start_outfit: 'default', goal: '', secrets: [] });

function slug(t) {
  return (t || '').toLowerCase().replace(/đ/g, 'd').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'nv';
}
function uniq(base, taken) { let id = base, i = 2; while (taken.includes(id)) id = base + '_' + i++; return id; }

function normalizeV2(raw) {
  const w = Object.assign(blankWorld(), raw || {});
  w.meta = Object.assign({ name: 'Thế giới mới', genre: '' }, w.meta);
  w.rules = Object.assign({ writing_style: '', world_rules: [] }, w.rules);
  w.user = Object.assign({ id: 'user', name: 'Bạn', aliases: [], persona: '' }, w.user);
  w.clock = Object.assign({ mode: 'calendar', start: { year: 2027, month: 8, day: 30, hour: 12, minute: 30 } }, w.clock);
  w.clock.start = Object.assign({ year: 2027, month: 8, day: 30, hour: 12, minute: 30 }, w.clock.start);
  w.locations = w.locations || {};
  w.lore = w.lore || [];
  w.characters = w.characters || {};
  w.cast = (w.cast || []).map(c => Object.assign(blankCast(c.char_id), c));
  for (const c of w.cast) {
    if (!w.characters[c.char_id]) w.characters[c.char_id] = blankCharV2(c.char_id, c.char_id);
    const ch = Object.assign(blankCharV2(c.char_id, c.char_id), w.characters[c.char_id]);
    ch.meta = Object.assign({ name: c.char_id, aliases: [], age: 20, gender: 'nữ', fictional: true }, ch.meta);
    ch.core = Object.assign({ one_liner: '', personality: [], values: '', boundaries: [] }, ch.core);
    ch.voice = Object.assign(blankCharV2(c.char_id, ch.meta.name).voice, ch.voice);
    ch.appearance = Object.assign({ summary: '', outfits: { default: '' } }, ch.appearance);
    ch.modules = ch.modules || [];
    w.characters[c.char_id] = ch;
  }
  w.relationships = Object.assign({ auto_bootstrap: true, edges: {} }, w.relationships);
  w.relationships.edges = w.relationships.edges || {};
  w.initial_facts = w.initial_facts || [];
  w.opening = Object.assign({ user_start_location: '', tension: 1, channel_type: 'in_person', narration: '' }, w.opening);
  return w;
}

let W = normalizeV2(load() && load().format === 'world-v2' ? load() : null);
let sel = 'chung';
const TENSION = ['0 · Rất thoải mái', '1 · Bình thường', '2 · Hơi căng', '3 · Căng thẳng', '4 · Rất căng'];

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k.startsWith('on')) e[k] = v; else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v); }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
const changed = () => { persist(); renderNav(); };

function field(label, get, set, opt = {}) {
  const cnt = opt.max ? h('span', { class: 'cnt' }) : null;
  const tag = opt.multi ? 'textarea' : 'input';
  const el = h(tag, { rows: opt.rows || 3, type: opt.type, placeholder: opt.ph || '' });
  el.value = get() ?? '';
  const upd = () => { if (cnt) { const n = el.value.length; cnt.textContent = n + '/' + opt.max; cnt.className = 'cnt' + (n > opt.max ? ' over' : ''); } };
  el.oninput = () => { set(opt.type === 'number' ? (el.value === '' ? null : +el.value) : el.value); upd(); changed(); };
  upd();
  return h('div', null, h('label', null, label, cnt), el, opt.hint ? h('div', { class: 'hint' }, opt.hint) : null);
}
function lines(label, arr, setArr, opt = {}) {
  return field(label, () => (arr() || []).join('\n'), v => setArr(v.split('\n').map(s => s.trim()).filter(Boolean)), Object.assign({ multi: true, rows: 2 }, opt));
}
function csv(label, arr, setArr, opt = {}) {
  return field(label, () => (arr() || []).join(', '), v => setArr(v.split(',').map(s => s.trim()).filter(Boolean)), opt);
}
function section(title, sub) { return h('h3', null, title, sub ? h('small', null, ' · ' + sub) : null); }

function issues() {
  const out = [], ids = W.cast.map(c => c.char_id);
  if (!(W.meta.name || '').trim()) out.push(['err', 'chung', 'Thế giới chưa có tên.']);
  if (!Object.keys(W.locations).length) out.push(['err', 'dia_diem', 'Chưa có địa điểm nào.']);
  if (!W.cast.length) out.push(['err', 'nhan_vat', 'Chưa có nhân vật nào.']);
  const op = W.opening;
  if (op.user_start_location && !(op.user_start_location in W.locations)) out.push(['err', 'mo_dau', `Mở đầu: địa điểm "${op.user_start_location}" không tồn tại.`]);
  if (!(op.narration || '').trim()) out.push(['warn', 'mo_dau', 'Chưa có lời dẫn mở đầu.']);
  W.cast.forEach((entry, i) => {
    const ch = W.characters[entry.char_id] || blankCharV2(entry.char_id, entry.char_id);
    const at = 'char:' + i, nm = ch.meta.name || ch.id;
    if (!/^[a-z0-9_]+$/.test(ch.id)) out.push(['err', at, `${nm}: id chỉ gồm a-z, 0-9, _`]);
    if (ids.indexOf(ch.id) !== i) out.push(['err', at, `${nm}: trùng id "${ch.id}"`]);
    if (!(ch.meta.name || '').trim()) out.push(['err', at, `${nm}: thiếu meta.name`]);
    if (!(ch.core.one_liner || '').trim()) out.push(['err', at, `${nm}: thiếu core.one_liner`]);
    if (!(ch.core.personality || []).length) out.push(['err', at, `${nm}: thiếu core.personality`]);
    if (ch.meta.fictional !== true) out.push(['err', at, `${nm}: phải xác nhận nhân vật hư cấu.`]);
    if ((ch.core.one_liner || '').length > 140) out.push(['warn', at, `${nm}: one_liner dài hơn 140 ký tự.`]);
  });
  return out;
}

function renderNav() {
  const iss = issues(), bad = s => iss.some(x => x[0] === 'err' && (x[1] === s || (s === 'nhan_vat' && x[1].startsWith('char:'))));
  const item = (key, label, sub) => h('div', { class: 'it' + (sel === key ? ' on' : ''), onclick: () => { sel = key; renderAll(); setDrawer(false); } },
    label, sub ? h('span', { class: 'sub' }, sub) : null, bad(key) ? h('span', { class: 'bad' }, '●') : null);
  const nav = $('nav'); nav.innerHTML = '';
  nav.append(h('h2', null, 'Thế giới (world-v2)'),
    item('chung', 'Chung & Người chơi'),
    item('dia_diem', 'Cây địa điểm', String(Object.keys(W.locations).length)),
    item('lore', 'Lore thế giới', String(W.lore.length)),
    item('mo_dau', 'Đồng hồ & Mở đầu'),
    item('quan_he', 'Đồ thị Quan hệ'),
    h('h2', null, 'Nhân vật (char-v2)'),
    ...W.cast.map((c, i) => {
      const ch = W.characters[c.char_id];
      return item('char:' + i, (ch && ch.meta.name) || c.char_id, ch && ch.meta.age != null ? ch.meta.age + 't' : '');
    }),
    h('div', { class: 'it', onclick: addChar }, '+ Nhân vật mới'),
    h('div', { class: 'it', onclick: () => $('fileIn').click() }, '⇪ Nhập file / SillyTavern'),
    h('h2', null, 'Kiểm tra'),
    item('check', 'Lỗi & cảnh báo', String(iss.length)));
  $('title').textContent = 'Soạn v2: ' + (W.meta.name || 'thế giới');
}
function renderAll() { renderNav(); renderSheet(); }

function renderSheet() {
  const s = $('sheet'); s.innerHTML = '';
  if (sel.startsWith('char:')) return charSheet(s, +sel.slice(5));
  ({ chung: generalSheet, dia_diem: placesSheet, lore: loreSheet, mo_dau: openingSheet, quan_he: relSheet, check: checkSheet }[sel] || generalSheet)(s);
}

function generalSheet(s) {
  s.append(h('h1', null, 'Chung & Người chơi (world-v2)'),
    h('p', { class: 'lead' }, 'Sân khấu tách biệt khỏi diễn viên. Các luật chung nằm ở Zone 1 để giữ ~100% KV Cache.'),
    h('div', { class: 'row' },
      field('Tên thế giới', () => W.meta.name, v => { W.meta.name = v; W.id = slug(v); }),
      field('Thể loại', () => W.meta.genre, v => W.meta.genre = v)),
    field('Quy chuẩn văn phong (writing_style)', () => W.rules.writing_style, v => W.rules.writing_style = v, { multi: true, rows: 4 }),
    lines('Luật thế giới (world_rules, mỗi dòng một luật)', () => W.rules.world_rules, v => W.rules.world_rules = v, { rows: 3 }),
    section('Người chơi'),

function placesSheet(s) {

    ...Object.entries(W.locations).map(([id, node]) => {
      const idIn = h('input', { value: id, title: 'id' });
      const nameIn = h('input', { value: node.name || '', placeholder: 'Tên hiển thị' });
      const parentSel = h('select', null, h('option', { value: '' }, '(gốc / không có cha)'),
        ...Object.keys(W.locations).filter(k => k !== id).map(k => h('option', { value: k, selected: k === node.parent }, W.locations[k].name || k)));
      const travelIn = h('input', { type: 'number', value: node.travel_min ?? 0, title: 'Thời gian di chuyển (phút)' });
      const tagsIn = h('input', { value: (node.tags || []).join(', '), placeholder: 'tags: indoor, public, private_possible' });
      const loreIn = h('input', { value: (node.lore_ids || []).join(', '), placeholder: 'lore_ids (cách nhau dấu phẩy)' });
      const descIn = h('textarea', { rows: 2, placeholder: 'Mô tả ngắn' }); descIn.value = node.desc || '';

      idIn.onchange = () => {
        const nid = uniq(slug(idIn.value), Object.keys(W.locations).filter(k => k !== id));
        const copy = {};
        for (const [k, v] of Object.entries(W.locations)) {
          if (v.parent === id) v.parent = nid;
          copy[k === id ? nid : k] = v;
        }
        W.locations = copy;
        if (W.opening.user_start_location === id) W.opening.user_start_location = nid;
        for (const c of W.cast) if (c.start_location === id) c.start_location = nid;
        changed(); renderSheet();
      };
      nameIn.oninput = () => { node.name = nameIn.value; changed(); };
      parentSel.onchange = () => { node.parent = parentSel.value || null; changed(); };
      travelIn.oninput = () => { node.travel_min = +travelIn.value || 0; changed(); };
      tagsIn.oninput = () => { node.tags = tagsIn.value.split(',').map(x => x.trim()).filter(Boolean); changed(); };
      loreIn.oninput = () => { node.lore_ids = loreIn.value.split(',').map(x => x.trim()).filter(Boolean); changed(); };
      descIn.oninput = () => { node.desc = descIn.value; changed(); };

      return h('div', { class: 'card' },
        h('div', { class: 'head' }, idIn, nameIn, parentSel,
          h('button', { class: 'small danger', onclick: () => { delete W.locations[id]; changed(); renderSheet(); } }, 'xoá')),

      changed(); renderSheet();

function relSheet(s) {
  const allIds = ['user', ...W.cast.map(c => c.char_id)];
  const nameOf = id => id === 'user' ? (W.user.name || 'user') : ((W.characters[id] && W.characters[id].meta.name) || id);
  const autoCb = h('input', { type: 'checkbox', checked: W.relationships.auto_bootstrap !== false });
  autoCb.onchange = () => { W.relationships.auto_bootstrap = autoCb.checked; changed(); };
  const statusEl = h('span', { style: 'font-size:12px;color:var(--ok)' });
  const bootBtn = h('button', { class: 'small', onclick: async () => {
    if (!W.cast.length) { alert('Hãy thêm ít nhất 1 nhân vật trước.'); return; }
    bootBtn.disabled = true; bootBtn.textContent = 'Đang sinh...'; statusEl.textContent = '';
    try {
      let opts = {};
      try { opts = JSON.parse(localStorage.getItem('rplabg.settings') || '{}'); } catch {}
      const r = await fetch('/api/group/bootstrap', {
        method: 'POST',
        body: JSON.stringify({ pack: W, force_refresh: true, use_llm: true, options: { provider: opts.provider || 'openrouter', model: opts.model, extract_model: opts.extract_model } }),
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      W.relationships.edges = (j.state && j.state.relationships && j.state.relationships.edges) || W.relationships.edges;
      changed(); renderSheet();
      alert('Đã sinh xong bảng quan hệ và lưu vào bản soạn! Bấm "Tải world-v2 .json" hoặc "▶ Chơi ngay" để sử dụng.');
    } catch (err) { alert('Lỗi bootstrap: ' + err.message); }
    finally { bootBtn.disabled = false; bootBtn.textContent = '✨ Tự sinh bằng AI (Bootstrap)'; }
  } }, '✨ Tự sinh bằng AI (Bootstrap)');
  s.append(h('h1', null, 'Đồ thị Quan hệ & Xưng hô (Sparse Edges)'),
    h('p', { class: 'lead' }, 'Các cặp bỏ trống sẽ tự fallback về voice.pronoun_defaults hoặc được Turn 0 Bootstrap tự sinh.'),
    h('div', { style: 'display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px' },
      h('div', { class: 'check', style: 'margin-top:0' }, autoCb, h('span', null, 'Bật auto_bootstrap khi khởi tạo phiên chơi')),
      bootBtn, statusEl));

  for (const src of allIds) {
    for (const tgt of allIds) {
      if (src === tgt) continue;
      const edge = (W.relationships.edges[src] && W.relationships.edges[src][tgt]) || null;
      if (!edge && src === 'user') continue;
      const e = edge || { tag: '', level: 50, default: { self: '', call: '', ref_3rd: nameOf(tgt) }, overrides: {} };
      const tagIn = h('input', { value: e.tag || '', placeholder: 'tag quan hệ (VD: bạn thân / đồng nghiệp)' });
      const lvlIn = h('input', { type: 'number', value: e.level ?? 50, style: 'flex:0 0 70px' });
      const saveEdge = () => {
        if (!tagIn.value.trim() && !(e.default && (e.default.self || e.default.call))) {
          if (W.relationships.edges[src]) delete W.relationships.edges[src][tgt];
        } else {
          W.relationships.edges[src] = W.relationships.edges[src] || {};
          W.relationships.edges[src][tgt] = e;
        }
        changed();
      };
      const mkPair = (title, objGet, objSet) => {
        const sIn = h('input', { value: (objGet() || {}).self || '', placeholder: 'xưng' });
        const cIn = h('input', { value: (objGet() || {}).call || '', placeholder: 'gọi' });
        const upd = () => { objSet(sIn.value.trim(), cIn.value.trim()); saveEdge(); };
        sIn.oninput = upd; cIn.oninput = upd;
        return h('div', null, h('label', null, title), sIn, h('div', { style: 'margin-top:3px' }, cIn));
      };
      tagIn.oninput = () => { e.tag = tagIn.value; saveEdge(); };
      lvlIn.oninput = () => { e.level = +lvlIn.value || 50; saveEdge(); };
      s.append(h('div', { class: 'card' },
        h('div', { class: 'head' }, h('b', { style: 'min-width:150px' }, `${nameOf(src)} → ${nameOf(tgt)}`), tagIn, lvlIn),
        h('div', { class: 'grid4' },
          mkPair('default', () => e.default, (a, b) => { e.default = { self: a, call: b, ref_3rd: nameOf(tgt) }; }),
          mkPair('private', () => (e.overrides || {}).private, (a, b) => { e.overrides = e.overrides || {}; if (a || b) e.overrides.private = { self: a, call: b }; else delete e.overrides.private; }),
          mkPair('public_formal', () => (e.overrides || {}).public_formal, (a, b) => { e.overrides = e.overrides || {}; if (a || b) e.overrides.public_formal = { self: a, call: b }; else delete e.overrides.public_formal; }),
          mkPair('tense', () => (e.overrides || {}).tense, (a, b) => { e.overrides = e.overrides || {}; if (a || b) e.overrides.tense = { self: a, call: b }; else delete e.overrides.tense; }))));
    }
  }
}

  });
  box.append(h('div', { style: 'margin-top:6px' }, h('button', { class: 'small', onclick: () => {
    entry.secrets.push({ id: uniq('sec_' + entry.char_id, entry.secrets.map(x => x.id)), text: '', known_by: [entry.char_id], reveal_when: '', keywords: [] });
    changed(); renderSheet();
  } }, '+ Thêm bí mật')));
  return box;
}

function addChar() {
  const name = prompt('Tên nhân vật?'); if (!name) return;
  const id = uniq(slug(name.split(' ').pop()), W.cast.map(c => c.char_id));
  W.characters[id] = blankCharV2(id, name.trim());
  W.cast.push(blankCast(id));
  sel = 'char:' + (W.cast.length - 1); persist(); renderAll();
}
function renameChar(i, raw) {
  const entry = W.cast[i], old = entry.char_id;
  const nid = uniq(slug(raw), W.cast.filter((_, idx) => idx !== i).map(c => c.char_id));
  if (nid === old) return renderSheet();
  entry.char_id = nid;
  W.characters[nid] = W.characters[old]; W.characters[nid].id = nid; delete W.characters[old];
  const edges = W.relationships.edges;
  if (old in edges) { edges[nid] = edges[old]; delete edges[old]; }
  for (const s of Object.values(edges)) if (old in s) { s[nid] = s[old]; delete s[old]; }
  changed(); renderSheet();
}
function delChar(i) {
  const entry = W.cast[i], ch = W.characters[entry.char_id];
  if (!confirm(`Xoá ${(ch && ch.meta.name) || entry.char_id}?`)) return;
  W.cast.splice(i, 1); delete W.characters[entry.char_id];
  delete W.relationships.edges[entry.char_id];
  for (const s of Object.values(W.relationships.edges)) delete s[entry.char_id];
  sel = 'chung'; persist(); renderAll();
}

function download(obj, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' })); a.download = name; a.click();
}
async function serverCheck() {
  try { return await (await fetch('/api/group/load', { method: 'POST', body: JSON.stringify(W) })).json(); }
  catch (e) { return { error: 'không kết nối được máy chủ: ' + e.message }; }
}
async function importFile(f) {
  const buf = await f.arrayBuffer();
  let obj = null; try { obj = JSON.parse(new TextDecoder().decode(buf).replace(/^﻿/, '')); } catch {}
  if (obj && (obj.format === 'world-v2' || obj.format === 'rplab-world-1' || obj.format === 'rplab-group-1')) {
    const r = await (await fetch('/api/group/load', { method: 'POST', body: JSON.stringify(obj) })).json();
    if (r.error) { alert(r.error); return; }
    if (!confirm(`Mở thế giới "${r.pack.meta.name}"? Bộ đang soạn sẽ bị thay.`)) return;
    W = normalizeV2(r.pack); sel = 'chung'; persist(); renderAll(); return;
  }
  const r = await (await fetch('/api/group/card', { method: 'POST', body: buf,
    headers: { 'X-Existing-Ids': encodeURIComponent(JSON.stringify(W.cast.map(c => c.char_id))) } })).json();
  if (r.error) { alert(f.name + ': ' + r.error); return; }
  const v2 = r.char;
  W.characters[v2.id] = v2;
  W.cast.push(blankCast(v2.id));
  if (r.mo_dau && !W.opening.narration.trim() && r.mo_dau.loi_dan && confirm('Card có lời chào (first_mes). Dùng làm lời dẫn mở đầu?')) W.opening.narration = r.mo_dau.loi_dan;
  if (r.mo_dau && r.mo_dau.boi_canh && confirm('Card có scenario. Thêm vào lore?'))
    W.lore.push({ id: uniq(slug('boi canh ' + v2.id), W.lore.map(x => x.id)), title: 'Bối cảnh ' + v2.meta.name, activation: 'director', keys: [], when: '', content: r.mo_dau.boi_canh });
  sel = 'char:' + (W.cast.length - 1); persist(); renderAll();
}
$('fileIn').onchange = async e => { for (const f of e.target.files) await importFile(f); e.target.value = ''; };
$('openBtn').onclick = () => $('fileIn').click();
$('newBtn').onclick = () => { if (!confirm('Bắt đầu bộ mới?')) return; W = blankWorld(); sel = 'chung'; persist(); renderAll(); };
$('sampleBtn').onclick = async () => { if (!confirm('Nạp mẫu Hoa Phượng (world-v2)? Bộ đang soạn sẽ bị thay.')) return;
  W = normalizeV2(await (await fetch('/api/group/sample_world')).json()); sel = 'chung'; persist(); renderAll(); };
$('sampleBnBtn').onclick = async () => { if (!confirm('Nạp mẫu ĐH Bến Nghé (world-v2)? Bộ đang soạn sẽ bị thay.')) return;
  W = normalizeV2(await (await fetch('/api/group/sample_world?world=ben_nghe')).json()); sel = 'chung'; persist(); renderAll(); };
$('saveBtn').onclick = () => download(W, slug(W.meta.name) + '.world-v2.json');
$('playBtn').onclick = async () => {
  if (issues().some(x => x[0] === 'err')) { sel = 'check'; renderAll(); alert('Còn lỗi, sửa trước khi chơi.'); return; }
  const r = await serverCheck(); if (r.error) { alert('Máy chủ báo lỗi: ' + r.error); return; }
  let hist = []; try { hist = JSON.parse(localStorage.getItem('rplabg.history') || '[]'); } catch {}
  if (hist.length && !confirm('Group chat đang có một cuộc chơi dở. Tạo ván mới từ thế giới này?')) return;
  const newSid = 'sess_' + Math.random().toString(36).slice(2, 10);
  const title = (r.pack.meta && r.pack.meta.name) || r.pack.name || 'Thế giới mới';
  try {
    await syncEditorToDB(true);
    const rs = await fetch('/api/db/session', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: newSid, mode: 'group', title, pack: r.pack, state: r.pack.state || {}, history: [] }),
    });
    if (!rs.ok) throw new Error('HTTP ' + rs.status);
    localStorage.setItem('rplabg.sessionId', JSON.stringify(newSid));
    localStorage.setItem('rplabg.pack', JSON.stringify(r.pack));
    localStorage.setItem('rplabg.state', JSON.stringify(r.pack.state || {}));
    localStorage.setItem('rplabg.history', '[]');
  } catch (e) { alert('Không lưu được phiên chơi mới: ' + e.message); return; }
  location.href = '/group';
};
renderAll();
(async () => {
  try {
    const r = await fetch('/api/db/editor?id=current');
    if (!r.ok) return;
    const j = await r.json();
    if (j && j.draft && j.draft.world) {
      W = normalizeV2(j.draft.world);
      try { localStorage.setItem(KEY, JSON.stringify(W)); } catch {}
      renderAll();
    } else if (load() && load().format === 'world-v2') {
      syncEditorToDB(true);
    }
  } catch {}
})();
</script>
</body>
</html>
